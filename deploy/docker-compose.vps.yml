x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M --max-connections=100 --performance-schema=OFF
    mem_limit: 288m
    cpus: "0.15"
    pids_limit: 100
    logging: *default-logging
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    mem_limit: 48m
    cpus: "0.02"
    pids_limit: 50
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: omnichannel-crm:latest
    env_file:
      - ../.env
    environment:
      LOCAL: "False"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      RUN_TELETHON_CLIENTS: "0"
    mem_limit: 192m
    cpus: "0.20"
    pids_limit: 100
    logging: *default-logging
    command: >
      sh -c "until python manage.py migrate --noinput; do
        echo 'MySQL is not ready yet; retrying in 5 seconds';
        sleep 5;
      done && python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../staticfiles:/app/staticfiles
      - ../media:/app/media
      - ../logs:/app/logs

  web:
    build:
      context: ..
    image: omnichannel-crm:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      LOCAL: "False"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      RUN_TELETHON_CLIENTS: "0"
    mem_limit: 192m
    cpus: "0.15"
    pids_limit: 100
    logging: *default-logging
    command: daphne -b 0.0.0.0 -p 8000 CRM.asgi:application
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../staticfiles:/app/staticfiles
      - ../media:/app/media
      - ../sessions:/app/sessions
      - ../logs:/app/logs

  connector:
    stop_grace_period: 30s
    image: omnichannel-crm:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      LOCAL: "False"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      RUN_TELETHON_CLIENTS: "0"
    mem_limit: 224m
    cpus: "0.18"
    pids_limit: 100
    logging: *default-logging
    command: python manage.py start_telegram_accounts --reconcile-interval 900 --account-refresh-interval 30
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../media:/app/media
      - ../sessions:/app/sessions
      - ../logs:/app/logs

  worker:
    stop_grace_period: 30s
    image: omnichannel-crm:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      LOCAL: "False"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      RUN_TELETHON_CLIENTS: "0"
    mem_limit: 192m
    cpus: "0.10"
    pids_limit: 100
    logging: *default-logging
    command: celery -A CRM worker --loglevel=INFO --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=50 --max-memory-per-child=140000
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../media:/app/media
      - ../logs:/app/logs

volumes:
  mysql_data:
  redis_data:
